<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="記帳本">
<meta name="theme-color" content="#C38ED5">
<link rel="manifest" href="manifest.json">
<title>記帳本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --purple: #C38ED5;
  --purple-dark: #9B59B6;
  --purple-deep: #7D3C98;
  --purple-light: #F3E5F5;
  --purple-pale: #FAF5FF;
  --purple-mid: #D7A8E8;
  --green: #27AE60;
  --red: #E74C3C;
  --gray: #9E9E9E;
  --gray-light: #F8F8F8;
  --white: #FFFFFF;
  --text: #2C2C2C;
  --text-sub: #9B8FA0;
  --radius: 20px;
  --radius-sm: 14px;
  --shadow: 0 6px 24px rgba(195,142,213,0.18);
  --shadow-sm: 0 2px 12px rgba(195,142,213,0.12);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; font-family: 'Noto Sans TC', sans-serif; background: var(--gray-light); color: var(--text); }
#app { height: 100dvh; display: flex; flex-direction: column; max-width: 430px; margin: 0 auto; position: relative; overflow: hidden; }

/* ── SCREENS ── */
.screen { display: none; flex-direction: column; height: 100%; overflow: hidden; }
.screen.active { display: flex; }

/* ── HOME GRADIENT BG ── */
#screen-home {
  background: linear-gradient(175deg, rgba(195,142,213,0.22) 0%, rgba(215,168,232,0.10) 38%, #FFFFFF 60%);
}

/* ── TOP BAR ── */
.topbar {
  background: linear-gradient(135deg, var(--purple) 0%, var(--purple-dark) 60%, var(--purple-deep) 100%);
  color: white; padding: 14px 18px 18px;
  flex-shrink: 0;
  border-radius: 0 0 28px 28px;
  box-shadow: 0 8px 28px rgba(155,89,182,0.28);
}
.topbar-row { display: flex; align-items: center; justify-content: space-between; }
.topbar h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }
.topbar-btn { background: rgba(255,255,255,0.22); border: 1.5px solid rgba(255,255,255,0.35); color: white; border-radius: 20px; padding: 6px 14px; font-size: 13px; font-family: inherit; cursor: pointer; display: flex; align-items: center; gap: 5px; }
.month-nav { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
.month-nav button { background: rgba(255,255,255,0.18); border: none; color: white; font-size: 20px; cursor: pointer; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.month-nav span { font-size: 17px; font-weight: 700; flex: 1; text-align: center; }
.summary-row { display: flex; gap: 10px; margin-top: 14px; }
.summary-card { flex: 1; background: rgba(255,255,255,0.20); border: 1px solid rgba(255,255,255,0.30); border-radius: 16px; padding: 11px 8px; text-align: center; backdrop-filter: blur(8px); }
.summary-card .label { font-size: 11px; opacity: 0.85; margin-bottom: 5px; }
.summary-card .val { font-size: 17px; font-weight: 700; color: white; }
.summary-card .val.green { color: #B9F6CA; }
.summary-card .val.red { color: #FFCDD2; }

/* ── SCROLL AREA ── */
.scroll-area { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 14px 88px; }
.scroll-area::-webkit-scrollbar { display: none; }

/* ── SECTION LABEL ── */
.section-label { font-size: 13px; font-weight: 700; color: var(--purple-dark); margin: 14px 2px 8px; display: flex; align-items: center; gap: 6px; }

/* ── DATE GROUP ── */
.date-group { background: white; border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; box-shadow: var(--shadow-sm); border: 1px solid rgba(195,142,213,0.10); }
.date-header { padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; background: var(--purple-pale); border-bottom: 1px solid rgba(195,142,213,0.12); }
.date-header .date-text { font-size: 13px; font-weight: 600; color: var(--purple-dark); }
.date-header .date-sum { font-size: 13px; font-weight: 600; color: var(--red); }
.tx-item { display: flex; align-items: center; padding: 13px 16px; gap: 13px; transition: background 0.15s; cursor: pointer; border-bottom: 1px solid rgba(195,142,213,0.07); }
.tx-item:last-child { border-bottom: none; }
.tx-item:active { background: var(--purple-light); }
.tx-icon { width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(135deg, rgba(195,142,213,0.18), rgba(195,142,213,0.08)); display: flex; align-items: center; justify-content: center; font-size: 23px; flex-shrink: 0; border: 1.5px solid rgba(195,142,213,0.20); }
.tx-info { flex: 1; }
.tx-name { font-size: 15px; font-weight: 600; color: var(--text); }
.tx-sub { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
.tx-right { text-align: right; }
.tx-amount { font-size: 16px; font-weight: 700; }
.tx-amount.expense { color: var(--red); }
.tx-amount.income { color: var(--green); }
.tx-acc { font-size: 11px; color: var(--text-sub); margin-top: 2px; }

/* ── BOTTOM NAV ── */
.bottom-nav {
  display: flex; background: white;
  border-top: 1px solid rgba(195,142,213,0.15);
  padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
  flex-shrink: 0; position: relative; z-index: 10;
  box-shadow: 0 -4px 20px rgba(195,142,213,0.12);
}
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; padding: 4px 0; transition: all 0.2s; }
.nav-icon { font-size: 22px; }
.nav-label { font-size: 11px; color: var(--gray); font-weight: 500; }
.nav-item.active .nav-label { color: var(--purple); }

/* ── FAB ── */
.fab {
  position: absolute; bottom: calc(62px + env(safe-area-inset-bottom) + 12px); right: 20px;
  width: 58px; height: 58px; border-radius: 50%;
  background: linear-gradient(135deg, var(--purple), var(--purple-dark));
  color: white; font-size: 30px; border: none; cursor: pointer;
  box-shadow: 0 6px 22px rgba(155,89,182,0.45); z-index: 20;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.2s;
}
.fab:active { transform: scale(0.91); }

/* ── MODAL OVERLAY ── */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(50,20,70,0.40); z-index: 100; align-items: flex-end; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal-sheet { background: white; width: 100%; max-width: 430px; border-radius: 30px 30px 0 0; max-height: 96dvh; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: env(safe-area-inset-bottom); animation: slideUp 0.3s cubic-bezier(.22,.9,.36,1); }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-handle { width: 42px; height: 4px; background: #E0D0EC; border-radius: 2px; margin: 12px auto 0; }

/* ── ADD FORM ── */
.add-header { padding: 16px 20px 10px; display: flex; align-items: center; justify-content: space-between; }
.add-header h2 { font-size: 18px; font-weight: 700; color: var(--purple-dark); }
.type-tabs { display: flex; gap: 0; margin: 0 16px 14px; background: var(--purple-light); border-radius: 14px; padding: 4px; }
.type-tab { flex: 1; padding: 9px 0; text-align: center; border-radius: 11px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; color: var(--purple-dark); opacity: 0.55; font-family: inherit; background: none; border: none; }
.type-tab.active-expense { background: linear-gradient(135deg, var(--purple), var(--purple-dark)); color: white; opacity: 1; box-shadow: 0 3px 10px rgba(155,89,182,0.35); }
.type-tab.active-income { background: linear-gradient(135deg, #27AE60, #1E8449); color: white; opacity: 1; box-shadow: 0 3px 10px rgba(39,174,96,0.35); }
.type-tab.active-transfer { background: linear-gradient(135deg, #2980B9, #1A5276); color: white; opacity: 1; box-shadow: 0 3px 10px rgba(41,128,185,0.35); }

.amount-display { text-align: center; padding: 8px 20px 16px; font-size: 46px; font-weight: 700; color: var(--purple); min-height: 72px; letter-spacing: -1px; }
.amount-display.placeholder { color: #D7A8E8; }

.cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 0 14px 14px; }
.cat-btn { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; padding: 10px 4px 8px; border-radius: 16px; transition: all 0.2s; background: var(--purple-pale); border: 2px solid transparent; }
.cat-btn:active { transform: scale(0.95); }
.cat-btn.selected { background: var(--purple-light); border-color: var(--purple); box-shadow: 0 2px 8px rgba(195,142,213,0.3); }
.cat-btn .cat-emoji { font-size: 26px; width: 46px; height: 46px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-sm); }
.cat-btn .cat-name { font-size: 11px; font-weight: 600; color: var(--purple-dark); }

.note-row { padding: 0 16px 12px; }
.note-input { width: 100%; padding: 12px 16px; border: 1.5px solid rgba(195,142,213,0.3); border-radius: 14px; font-family: inherit; font-size: 14px; color: var(--text); background: var(--purple-pale); outline: none; }
.note-input:focus { border-color: var(--purple); background: white; }

.date-row { padding: 0 16px 16px; display: flex; align-items: center; gap: 10px; }
.date-row label { font-size: 14px; color: var(--text-sub); font-weight: 500; white-space: nowrap; }
.date-input { flex: 1; padding: 10px 14px; border: 1.5px solid rgba(195,142,213,0.3); border-radius: 14px; font-family: inherit; font-size: 14px; color: var(--text); background: var(--purple-pale); outline: none; }
.date-input:focus { border-color: var(--purple); }

/* ── NUMPAD ── */
.numpad { background: linear-gradient(170deg, rgba(195,142,213,0.15) 0%, rgba(195,142,213,0.08) 100%); border-radius: 0; padding: 14px 16px 18px; border-top: 1px solid rgba(195,142,213,0.15); }
.numpad-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; }
.numpad-btn { background: white; border: none; border-radius: 16px; padding: 17px 8px; font-size: 18px; font-weight: 600; color: var(--text); cursor: pointer; font-family: inherit; transition: all 0.15s; box-shadow: 0 2px 8px rgba(195,142,213,0.12); }
.numpad-btn:active { transform: scale(0.92); background: var(--purple-light); }
.numpad-btn.op { background: rgba(195,142,213,0.15); color: var(--purple-dark); }
.numpad-btn.confirm-btn { background: linear-gradient(135deg, var(--purple), var(--purple-dark)); color: white; box-shadow: 0 4px 12px rgba(155,89,182,0.38); }
.numpad-btn.del-btn { background: rgba(195,142,213,0.20); color: var(--purple-dark); }
.numpad-btn.today-btn { background: rgba(130,200,220,0.20); color: #00838F; font-size: 12px; font-weight: 700; }

/* ── CHART SCREEN ── */
.chart-topbar { background: linear-gradient(135deg, var(--purple) 0%, var(--purple-dark) 60%, var(--purple-deep) 100%); color: white; padding: 14px 18px 16px; flex-shrink: 0; border-radius: 0 0 28px 28px; box-shadow: 0 8px 28px rgba(155,89,182,0.28); }
.chart-topbar h1 { font-size: 18px; font-weight: 700; text-align: center; margin-bottom: 10px; }
.chart-tabs { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 2px; }
.chart-tabs::-webkit-scrollbar { display: none; }
.chart-tab { padding: 7px 15px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.2s; color: rgba(255,255,255,0.7); border: 1.5px solid rgba(255,255,255,0.25); background: transparent; font-family: inherit; }
.chart-tab.active { background: white; color: var(--purple-dark); border-color: white; box-shadow: 0 2px 8px rgba(0,0,0,0.12); }

.donut-wrap { background: white; border-radius: var(--radius); margin: 14px 14px 0; padding: 22px; box-shadow: var(--shadow-sm); border: 1px solid rgba(195,142,213,0.10); display: flex; flex-direction: column; align-items: center; }
.donut-title { font-size: 13px; color: var(--text-sub); margin-bottom: 3px; }
.donut-amount { font-size: 24px; font-weight: 700; color: var(--purple-dark); margin-bottom: 18px; }
.donut-container { position: relative; width: 200px; height: 200px; }
.donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
.donut-center-label { font-size: 12px; color: var(--text-sub); }
.donut-center-val { font-size: 18px; font-weight: 700; color: var(--purple-dark); }

.cat-list { background: white; border-radius: var(--radius); margin: 10px 14px 0; overflow: hidden; box-shadow: var(--shadow-sm); border: 1px solid rgba(195,142,213,0.10); }
.cat-list-item { display: flex; align-items: center; padding: 13px 16px; gap: 12px; border-bottom: 1px solid rgba(195,142,213,0.08); }
.cat-list-item:last-child { border-bottom: none; }
.cat-list-icon { font-size: 24px; width: 40px; height: 40px; background: var(--purple-pale); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.cat-list-name { flex: 1; font-size: 15px; font-weight: 600; }
.cat-list-pct { font-size: 13px; color: var(--text-sub); width: 38px; text-align: right; }
.cat-list-amt { font-size: 15px; font-weight: 700; color: var(--purple-dark); width: 76px; text-align: right; }

/* ── CALENDAR ── */
#screen-cal { background: linear-gradient(175deg, rgba(195,142,213,0.15) 0%, #FFFFFF 45%); }
.cal-wrap { background: white; border-radius: var(--radius); margin: 14px 14px 0; box-shadow: var(--shadow-sm); overflow: hidden; border: 1px solid rgba(195,142,213,0.10); }
.cal-header { padding: 14px 16px 10px; display: flex; align-items: center; justify-content: space-between; }
.cal-header button { background: var(--purple-light); border: none; font-size: 18px; cursor: pointer; color: var(--purple-dark); width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.cal-header span { font-size: 16px; font-weight: 700; color: var(--purple-deep); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 0 10px 12px; }
.cal-dow { text-align: center; font-size: 11px; font-weight: 700; padding: 4px 0 8px; color: var(--text-sub); }
.cal-dow:first-child { color: var(--red); }
.cal-dow:last-child { color: var(--purple); }
.cal-day { text-align: center; padding: 2px 1px 4px; border-radius: 10px; cursor: pointer; min-height: 46px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.cal-day:active { background: var(--purple-light); }
.cal-day.today .day-num { background: linear-gradient(135deg, var(--purple), var(--purple-dark)); color: white; }
.cal-day.other-month .day-num { color: #DDD; }
.cal-day .day-num { font-size: 14px; font-weight: 500; width: 29px; height: 29px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
.cal-day.sun .day-num { color: var(--red); }
.cal-day.sat .day-num { color: var(--purple); }
.day-dot { font-size: 10px; font-weight: 700; color: var(--red); line-height: 1.1; }
.day-dot.income { color: var(--green); }

.cal-summary { display: flex; gap: 8px; padding: 10px 16px 14px; border-top: 1px solid rgba(195,142,213,0.10); background: var(--purple-pale); }
.cal-sum-item { flex: 1; text-align: center; }
.cal-sum-label { font-size: 11px; color: var(--text-sub); margin-bottom: 3px; }
.cal-sum-val { font-size: 16px; font-weight: 700; }
.cal-sum-val.red { color: var(--red); }
.cal-sum-val.green { color: var(--green); }
.cal-sum-val.purple { color: var(--purple-dark); }

/* ── TREND ── */
.trend-wrap { background: white; border-radius: var(--radius); margin: 10px 14px 0; padding: 18px; box-shadow: var(--shadow-sm); border: 1px solid rgba(195,142,213,0.10); }
.trend-title { font-size: 14px; font-weight: 600; color: var(--text-sub); margin-bottom: 12px; }
.trend-canvas-wrap { width: 100%; height: 180px; }
.balance-list { background: white; border-radius: var(--radius); margin: 10px 14px 10px; overflow: hidden; box-shadow: var(--shadow-sm); border: 1px solid rgba(195,142,213,0.10); }
.balance-item { display: flex; align-items: center; padding: 12px 16px; gap: 12px; border-bottom: 1px solid rgba(195,142,213,0.08); }
.balance-item:last-child { border-bottom: none; }
.balance-flow { flex: 1; font-size: 15px; font-weight: 600; }
.balance-flow.positive { color: var(--green); }
.balance-flow.negative { color: var(--red); }
.balance-total { font-size: 15px; font-weight: 700; color: var(--purple-dark); }

/* ── EMPTY STATE ── */
.empty-state { text-align: center; padding: 50px 20px; color: var(--text-sub); }
.empty-state .emoji { font-size: 52px; margin-bottom: 14px; filter: drop-shadow(0 4px 8px rgba(195,142,213,0.3)); }
.empty-state p { font-size: 15px; line-height: 1.7; }

/* ── BUTTONS ── */
.close-btn { background: var(--purple-light); border: none; font-size: 16px; cursor: pointer; color: var(--purple-dark); width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.check-btn { background: linear-gradient(135deg, var(--purple), var(--purple-dark)); border: none; color: white; border-radius: 50%; width: 36px; height: 36px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(155,89,182,0.38); }

/* ── TOAST ── */
.toast { position: fixed; bottom: calc(82px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%) translateY(16px); background: rgba(80,20,110,0.88); color: white; padding: 10px 24px; border-radius: 24px; font-size: 14px; opacity: 0; transition: all 0.28s; z-index: 200; pointer-events: none; white-space: nowrap; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── ANIMATIONS ── */
.date-group { animation: fadeUp 0.28s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div id="app">

<!-- ════════ HOME ════════ -->
<div class="screen active" id="screen-home">
  <div class="topbar">
    <div class="topbar-row">
      <span style="font-size:20px;cursor:pointer">🔍</span>
      <h1>💜 記帳本</h1>
      <button class="topbar-btn" onclick="switchScreen('screen-cal')">📅 日曆</button>
    </div>
    <div class="month-nav">
      <button onclick="changeMonth(-1)">‹</button>
      <span id="month-label">2026年6月</span>
      <button onclick="changeMonth(1)">›</button>
    </div>
    <div class="summary-row">
      <div class="summary-card">
        <div class="label">💜 總額</div>
        <div class="val" id="sum-total">$0</div>
      </div>
      <div class="summary-card">
        <div class="label">💚 收入</div>
        <div class="val green" id="sum-income">$0</div>
      </div>
      <div class="summary-card">
        <div class="label">❤️ 支出</div>
        <div class="val red" id="sum-expense">$0</div>
      </div>
    </div>
  </div>
  <div class="scroll-area" id="tx-list">
    <div class="empty-state" id="empty-msg">
      <div class="emoji">💜</div>
      <p>還沒有任何記錄<br>點右下角 <strong>+</strong> 新增第一筆吧！</p>
    </div>
  </div>
</div>

<!-- ════════ CHART ════════ -->
<div class="screen" id="screen-chart">
  <div class="chart-topbar">
    <h1>圖表分析</h1>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
      <button onclick="changeMonth(-1)" style="background:rgba(255,255,255,0.18);border:none;color:white;font-size:20px;cursor:pointer;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center">‹</button>
      <span style="font-size:15px;font-weight:700" id="chart-month-label">2026年6月</span>
      <button onclick="changeMonth(1)" style="background:rgba(255,255,255,0.18);border:none;color:white;font-size:20px;cursor:pointer;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center">›</button>
    </div>
    <div class="chart-tabs">
      <button class="chart-tab active" onclick="switchChartTab('expense')">🛒 支出分析</button>
      <button class="chart-tab" onclick="switchChartTab('income')">💰 收入分析</button>
      <button class="chart-tab" onclick="switchChartTab('trend')">📈 資產趨勢</button>
    </div>
  </div>
  <div class="scroll-area" id="chart-content" style="padding-top:0"></div>
</div>

<!-- ════════ CALENDAR ════════ -->
<div class="screen" id="screen-cal">
  <div class="topbar">
    <div class="topbar-row">
      <button onclick="switchScreen('screen-home')" style="background:rgba(255,255,255,0.18);border:none;color:white;font-size:22px;cursor:pointer;padding:4px 10px;border-radius:20px">‹</button>
      <h1>📅 日曆</h1>
      <span style="width:50px"></span>
    </div>
  </div>
  <div class="scroll-area" id="cal-content"></div>
</div>

<!-- ════════ BOTTOM NAV ════════ -->
<nav class="bottom-nav">
  <div class="nav-item active" id="nav-home" onclick="switchScreen('screen-home')">
    <span class="nav-icon">📒</span>
    <span class="nav-label">記帳本</span>
  </div>
  <div class="nav-item" id="nav-chart" onclick="switchScreen('screen-chart')">
    <span class="nav-icon">🥧</span>
    <span class="nav-label">圖表分析</span>
  </div>
  <div class="nav-item" id="nav-cal" onclick="switchScreen('screen-cal')">
    <span class="nav-icon">📅</span>
    <span class="nav-label">日曆</span>
  </div>
</nav>

<button class="fab" onclick="openAddModal()">+</button>

<!-- ════════ ADD MODAL ════════ -->
<div class="modal-overlay" id="add-modal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="add-header">
      <button class="close-btn" onclick="closeAddModal()">✕</button>
      <h2 id="modal-title">新增記錄</h2>
      <button class="check-btn" onclick="saveRecord()">✓</button>
    </div>
    <div class="type-tabs">
      <button class="type-tab active-expense" id="tab-expense" onclick="setType('expense')">支出</button>
      <button class="type-tab" id="tab-income" onclick="setType('income')">收入</button>
      <button class="type-tab" id="tab-transfer" onclick="setType('transfer')">轉帳</button>
    </div>
    <div class="amount-display placeholder" id="amount-display">0</div>
    <div style="padding:0 16px 10px;font-size:13px;font-weight:700;color:var(--purple-dark)">選擇類別</div>
    <div class="cat-grid" id="cat-grid"></div>
    <div class="note-row">
      <input class="note-input" id="note-input" placeholder="✏️ 備註（選填）" maxlength="50">
    </div>
    <div class="date-row">
      <label>📅 日期</label>
      <input class="date-input" type="date" id="date-input">
    </div>
    <div class="numpad">
      <div class="numpad-grid">
        <button class="numpad-btn today-btn" onclick="setToday()">TODAY</button>
        <button class="numpad-btn" onclick="numInput('7')">7</button>
        <button class="numpad-btn" onclick="numInput('8')">8</button>
        <button class="numpad-btn" onclick="numInput('9')">9</button>
        <button class="numpad-btn op" onclick="numInput('×')">×</button>
        <button class="numpad-btn" onclick="numInput('4')">4</button>
        <button class="numpad-btn" onclick="numInput('5')">5</button>
        <button class="numpad-btn" onclick="numInput('6')">6</button>
        <button class="numpad-btn op" onclick="numInput('÷')">÷</button>
        <button class="numpad-btn" onclick="numInput('1')">1</button>
        <button class="numpad-btn" onclick="numInput('2')">2</button>
        <button class="numpad-btn" onclick="numInput('3')">3</button>
        <button class="numpad-btn op" onclick="numInput('-')">-</button>
        <button class="numpad-btn" onclick="numInput('.')">.</button>
        <button class="numpad-btn" onclick="numInput('0')">0</button>
        <button class="numpad-btn del-btn" onclick="numDelete()">⌫</button>
        <button class="numpad-btn op" onclick="numInput('+')">+</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const CATS = {
  expense: [
    {id:'food',name:'飲食',emoji:'🍔'},{id:'daily',name:'日用',emoji:'🌿'},
    {id:'trans',name:'交通',emoji:'🚌'},{id:'house',name:'居家',emoji:'🏠'},
    {id:'social',name:'社交',emoji:'🥂'},{id:'gift',name:'禮物',emoji:'🎁'},
    {id:'comm',name:'通信',emoji:'📱'},{id:'cloth',name:'服飾',emoji:'👗'},
    {id:'entertain',name:'娛樂',emoji:'🎮'},{id:'beauty',name:'美容',emoji:'💄'},
    {id:'medical',name:'醫療',emoji:'🏥'},{id:'tax',name:'稅金',emoji:'💵'},
  ],
  income: [
    {id:'salary',name:'薪資',emoji:'💼'},{id:'bonus',name:'獎金',emoji:'🎉'},
    {id:'invest',name:'投資',emoji:'📈'},{id:'sidejob',name:'兼職',emoji:'🔧'},
    {id:'gift_in',name:'收禮',emoji:'🎀'},{id:'other',name:'其他',emoji:'💰'},
  ],
  transfer: [
    {id:'bank',name:'銀行',emoji:'🏦'},{id:'card',name:'信用卡',emoji:'💳'},
    {id:'cash',name:'現金',emoji:'💴'},{id:'other2',name:'其他',emoji:'🔄'},
  ]
};

const CHART_COLORS = ['#C38ED5','#9B59B6','#7D3C98','#E91E63','#F06292','#FF8A65','#FFB74D','#81C784','#4FC3F7','#4DD0E1','#7986CB','#A5D6A7'];

let records = JSON.parse(localStorage.getItem('lzb_records') || '[]');
let currentMonth = new Date().toISOString().slice(0,7);
let addType = 'expense', selectedCat = '', amountStr = '', editId = null;
let chartTabActive = 'expense', donutChart = null, trendChart = null;

function saveData() { localStorage.setItem('lzb_records', JSON.stringify(records)); }
function fmt(n) { return '$' + Math.abs(n).toLocaleString('en',{minimumFractionDigits:0,maximumFractionDigits:2}); }
function getMonthRecords(ym) { return records.filter(r => r.date.startsWith(ym)); }
function getMonthLabel(ym) { const [y,m]=ym.split('-'); return `${y}年${parseInt(m)}月`; }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function changeMonth(dir) {
  const [y,m] = currentMonth.split('-').map(Number);
  const d = new Date(y, m-1+dir, 1);
  currentMonth = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  document.getElementById('month-label').textContent = getMonthLabel(currentMonth);
  document.getElementById('chart-month-label').textContent = getMonthLabel(currentMonth);
  renderHome(); renderChartContent(); renderCal();
}

function switchScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const map = {'screen-home':'nav-home','screen-chart':'nav-chart','screen-cal':'nav-cal'};
  if (map[id]) document.getElementById(map[id]).classList.add('active');
  if (id==='screen-home') renderHome();
  if (id==='screen-chart') renderChartContent();
  if (id==='screen-cal') renderCal();
}

// ── HOME ──
function renderHome() {
  const recs = getMonthRecords(currentMonth);
  const income = recs.filter(r=>r.type==='income').reduce((a,r)=>a+r.amount,0);
  const expense = recs.filter(r=>r.type==='expense').reduce((a,r)=>a+r.amount,0);
  const net = income - expense;
  document.getElementById('sum-income').textContent = fmt(income);
  document.getElementById('sum-expense').textContent = fmt(expense);
  const totEl = document.getElementById('sum-total');
  totEl.textContent = (net < 0 ? '-' : '') + fmt(net);
  totEl.style.color = net < 0 ? '#FFCDD2' : 'white';

  const list = document.getElementById('tx-list');
  const empty = document.getElementById('empty-msg');
  if (recs.length === 0) { list.innerHTML = ''; list.appendChild(empty); empty.style.display=''; return; }
  empty.style.display = 'none';

  const byDate = {};
  recs.forEach(r => { (byDate[r.date] = byDate[r.date]||[]).push(r); });
  list.innerHTML = '';
  Object.keys(byDate).sort((a,b)=>b.localeCompare(a)).forEach(date => {
    const items = byDate[date];
    const dayExp = items.filter(r=>r.type==='expense').reduce((a,r)=>a+r.amount,0);
    const dayInc = items.filter(r=>r.type==='income').reduce((a,r)=>a+r.amount,0);
    const [,m,d] = date.split('-');
    const wd = ['週日','週一','週二','週三','週四','週五','週六'][new Date(date).getDay()];
    const grp = document.createElement('div'); grp.className = 'date-group';
    let sumTxt = '';
    if (dayExp > 0) sumTxt += `支出:${fmt(dayExp)}`;
    if (dayInc > 0) sumTxt += (sumTxt?' ':'') + `收入:${fmt(dayInc)}`;
    grp.innerHTML = `<div class="date-header"><span class="date-text">${parseInt(m)}/${parseInt(d)}（${wd}）</span><span class="date-sum">${sumTxt}</span></div>`;
    const allCats = [...CATS.expense,...CATS.income,...CATS.transfer];
    items.sort((a,b)=>b.id.localeCompare(a.id)).forEach(r => {
      const cat = allCats.find(c=>c.id===r.cat)||{emoji:'💰',name:r.cat};
      const div = document.createElement('div'); div.className='tx-item';
      div.innerHTML = `<div class="tx-icon">${cat.emoji}</div><div class="tx-info"><div class="tx-name">${cat.name}</div><div class="tx-sub">${r.note||'自己'}</div></div><div class="tx-right"><div class="tx-amount ${r.type}">${r.type==='expense'?'-':'+'}${fmt(r.amount)}</div><div class="tx-acc">預設帳戶</div></div>`;
      div.onclick = () => openEditModal(r.id);
      grp.appendChild(div);
    });
    list.appendChild(grp);
  });
}

// ── MODAL ──
function openAddModal() {
  editId = null; amountStr = ''; selectedCat = '';
  setType('expense');
  document.getElementById('note-input').value = '';
  document.getElementById('date-input').value = new Date().toISOString().slice(0,10);
  updateAmountDisplay();
  document.getElementById('modal-title').textContent = '新增記錄';
  document.getElementById('add-modal').classList.add('open');
}
function openEditModal(id) {
  const r = records.find(x=>x.id===id); if(!r) return;
  editId = id; amountStr = String(r.amount); selectedCat = r.cat;
  setType(r.type);
  document.getElementById('note-input').value = r.note||'';
  document.getElementById('date-input').value = r.date;
  updateAmountDisplay();
  document.getElementById('modal-title').textContent = '編輯記錄';
  document.getElementById('add-modal').classList.add('open');
  renderCatGrid();
}
function closeAddModal() { document.getElementById('add-modal').classList.remove('open'); }

function setType(t) {
  addType = t;
  ['expense','income','transfer'].forEach(x => {
    const el = document.getElementById('tab-'+x);
    el.className = 'type-tab' + (x===t ? ' active-'+t : '');
  });
  renderCatGrid();
}

function renderCatGrid() {
  const grid = document.getElementById('cat-grid');
  const cats = CATS[addType]||CATS.expense;
  grid.innerHTML = cats.map(c => `
    <button class="cat-btn${c.id===selectedCat?' selected':''}" onclick="selectCat('${c.id}')">
      <div class="cat-emoji">${c.emoji}</div>
      <div class="cat-name">${c.name}</div>
    </button>`).join('');
}

function selectCat(id) { selectedCat = id; renderCatGrid(); }

function updateAmountDisplay() {
  const el = document.getElementById('amount-display');
  el.textContent = amountStr || '0';
  el.className = 'amount-display' + (amountStr ? '' : ' placeholder');
}

function numInput(ch) {
  if (ch==='×') ch='*'; if (ch==='÷') ch='/';
  if ('+-*/'.includes(ch)) { amountStr += ch; }
  else if (ch==='.') { const p=amountStr.split(/[+\-*/]/); if (!p[p.length-1].includes('.')) amountStr+=ch; }
  else { if (amountStr.length < 12) amountStr += ch; }
  updateAmountDisplay();
}
function numDelete() { amountStr = amountStr.slice(0,-1); updateAmountDisplay(); }
function setToday() { document.getElementById('date-input').value = new Date().toISOString().slice(0,10); showToast('已設為今天'); }

function evalAmount(s) {
  try { const v = Function('"use strict";return('+s.replace(/[^0-9+\-*/.]/g,'')+')'); const r=v(); return (isNaN(r)||r<=0)?null:Math.round(r*100)/100; } catch { return null; }
}

function saveRecord() {
  const amount = evalAmount(amountStr);
  if (!amount) { showToast('請輸入金額'); return; }
  if (!selectedCat) { showToast('請選擇類別'); return; }
  const date = document.getElementById('date-input').value;
  if (!date) { showToast('請選擇日期'); return; }
  const note = document.getElementById('note-input').value;
  if (editId) {
    const i = records.findIndex(r=>r.id===editId);
    if (i>=0) records[i] = {...records[i], amount, cat:selectedCat, type:addType, date, note};
  } else {
    records.push({id:Date.now().toString(), amount, cat:selectedCat, type:addType, date, note});
  }
  saveData(); closeAddModal(); renderHome();
  showToast(editId ? '✅ 已更新' : '💜 記錄已儲存');
}

// ── CHART ──
function switchChartTab(tab) {
  chartTabActive = tab;
  document.querySelectorAll('.chart-tab').forEach((el,i) => el.classList.toggle('active', ['expense','income','trend'][i]===tab));
  renderChartContent();
}

function renderChartContent() {
  const c = document.getElementById('chart-content'); c.innerHTML = '';
  chartTabActive==='trend' ? renderTrendChart(c) : renderDonutChart(c);
}

function renderDonutChart(container) {
  const recs = getMonthRecords(currentMonth).filter(r=>r.type===chartTabActive);
  const total = recs.reduce((a,r)=>a+r.amount,0);
  const bycat = {}; recs.forEach(r => bycat[r.cat]=(bycat[r.cat]||0)+r.amount);
  const sorted = Object.entries(bycat).sort((a,b)=>b[1]-a[1]);

  const wrap = document.createElement('div'); wrap.className='donut-wrap';
  wrap.innerHTML = `<div class="donut-title">${chartTabActive==='expense'?'總支出':'總收入'}</div><div class="donut-amount">${fmt(total)}</div><div class="donut-container"><canvas id="donut-canvas" width="200" height="200"></canvas><div class="donut-center"><div class="donut-center-label">${chartTabActive==='expense'?'總支出':'總收入'}</div><div class="donut-center-val">${fmt(total)}</div></div></div>`;
  container.appendChild(wrap);

  if (donutChart) { donutChart.destroy(); donutChart=null; }
  if (!sorted.length) { wrap.insertAdjacentHTML('beforeend','<p style="color:var(--text-sub);font-size:13px;margin-top:12px">本月無記錄</p>'); return; }

  const allCats = [...CATS.expense,...CATS.income,...CATS.transfer];
  setTimeout(() => {
    const ctx = document.getElementById('donut-canvas'); if (!ctx) return;
    donutChart = new Chart(ctx, {
      type:'doughnut',
      data:{labels:sorted.map(([id])=>allCats.find(c=>c.id===id)?.name||id),datasets:[{data:sorted.map(([,v])=>v),backgroundColor:CHART_COLORS,borderWidth:2,borderColor:'#fff',hoverOffset:8}]},
      options:{cutout:'63%',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.label}: ${fmt(c.raw)} (${Math.round(c.raw/total*100)}%)`}}},animation:{duration:500}}
    });
  }, 50);

  const list = document.createElement('div'); list.className='cat-list';
  sorted.forEach(([id,val]) => {
    const cat = allCats.find(c=>c.id===id)||{emoji:'💰',name:id};
    const pct = total ? Math.round(val/total*100) : 0;
    const item = document.createElement('div'); item.className='cat-list-item';
    item.innerHTML = `<div class="cat-list-icon">${cat.emoji}</div><div class="cat-list-name">${cat.name}</div><div class="cat-list-pct">${pct}%</div><div class="cat-list-amt">${fmt(val)}</div>`;
    list.appendChild(item);
  });
  container.appendChild(list);
}

function renderTrendChart(container) {
  const recs = getMonthRecords(currentMonth);
  const [y,m] = currentMonth.split('-').map(Number);
  const days = new Date(y,m,0).getDate();
  const daily = {}; for(let d=1;d<=days;d++) daily[d]=0;
  recs.forEach(r => { const d=parseInt(r.date.split('-')[2]); daily[d]+=(r.type==='income'?1:-1)*r.amount; });
  let cum=0; const cumData=[];
  for(let d=1;d<=days;d++) { cum+=daily[d]; cumData.push({x:d,y:cum}); }

  const wrap = document.createElement('div'); wrap.className='trend-wrap';
  wrap.innerHTML = `<div class="trend-title">💜 淨資產趨勢</div><div class="trend-canvas-wrap"><canvas id="trend-canvas"></canvas></div>`;
  container.appendChild(wrap);

  if (trendChart) { trendChart.destroy(); trendChart=null; }
  setTimeout(() => {
    const ctx = document.getElementById('trend-canvas'); if(!ctx) return;
    trendChart = new Chart(ctx, {
      type:'line',
      data:{datasets:[{data:cumData,borderColor:'#C38ED5',backgroundColor:'rgba(195,142,213,0.15)',fill:true,tension:0.4,pointRadius:3,pointBackgroundColor:'#9B59B6',borderWidth:2.5}]},
      options:{responsive:true,maintainAspectRatio:false,scales:{x:{type:'linear',min:1,max:days,ticks:{maxTicksLimit:6,callback:v=>`${m}/${v}`},grid:{color:'rgba(195,142,213,0.1)'}},y:{ticks:{callback:v=>v>=1000?`${(v/1000).toFixed(0)}k`:v},grid:{color:'rgba(195,142,213,0.1)'}}},plugins:{legend:{display:false}},animation:{duration:500}}
    });
  }, 50);

  const byDate = {};
  recs.forEach(r => { const d=r.date.split('-')[2]; byDate[d]=byDate[d]||{inc:0,exp:0}; if(r.type==='income') byDate[d].inc+=r.amount; else if(r.type==='expense') byDate[d].exp+=r.amount; });
  const bList = document.createElement('div'); bList.className='balance-list';
  const entries = Object.entries(byDate).sort((a,b)=>b[0].localeCompare(a[0]));
  const totalNet = entries.reduce((a,[,v])=>a+(v.inc-v.exp),0);
  bList.innerHTML = `<div class="balance-item"><span style="font-size:20px">∑</span><div class="balance-flow positive" style="flex:1">總額</div><div class="balance-total">${(totalNet<0?'-':'')+fmt(totalNet)}</div></div>`;
  entries.forEach(([d,v]) => {
    const net=v.inc-v.exp;
    const item=document.createElement('div'); item.className='balance-item';
    item.innerHTML=`<span style="font-size:18px">📅</span><div class="balance-flow ${net>=0?'positive':'negative'}" style="flex:1">${parseInt(m)}/${parseInt(d)}</div><div class="balance-total" style="${net<0?'color:var(--red)':''}">${(net<0?'-':'')+fmt(net)}</div>`;
    bList.appendChild(item);
  });
  container.appendChild(bList);
}

// ── CALENDAR ──
function renderCal() {
  const container = document.getElementById('cal-content'); container.innerHTML = '';
  const [y,m] = currentMonth.split('-').map(Number);
  const firstDay = new Date(y,m-1,1).getDay();
  const daysInMonth = new Date(y,m,0).getDate();
  const today = new Date().toISOString().slice(0,10);
  const recs = getMonthRecords(currentMonth);
  const dayMap = {};
  recs.forEach(r => { const d=r.date.split('-')[2]; dayMap[d]=dayMap[d]||{exp:0,inc:0}; if(r.type==='expense') dayMap[d].exp+=r.amount; else if(r.type==='income') dayMap[d].inc+=r.amount; });

  const wrap = document.createElement('div'); wrap.className='cal-wrap';
  const nav = document.createElement('div'); nav.className='cal-header';
  nav.innerHTML = `<button onclick="changeMonth(-1)">‹</button><span>${getMonthLabel(currentMonth)}</span><button onclick="changeMonth(1)">›</button>`;
  wrap.appendChild(nav);

  const grid = document.createElement('div'); grid.className='cal-grid';
  ['週日','週一','週二','週三','週四','週五','週六'].forEach(d => { const el=document.createElement('div'); el.className='cal-dow'; el.textContent=d; grid.appendChild(el); });

  for(let i=0;i<firstDay;i++) { const el=document.createElement('div'); el.className='cal-day other-month'; grid.appendChild(el); }
  for(let d=1;d<=daysInMonth;d++) {
    const dateStr=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dow=new Date(dateStr).getDay();
    const el=document.createElement('div');
    el.className='cal-day'+(dateStr===today?' today':'')+(dow===0?' sun':dow===6?' sat':'');
    const dn=document.createElement('div'); dn.className='day-num'; dn.textContent=d; el.appendChild(dn);
    const dm=dayMap[String(d).padStart(2,'0')]||dayMap[String(d)];
    if(dm) {
      if(dm.exp>0){const dd=document.createElement('div');dd.className='day-dot';dd.textContent=`-${dm.exp>=10000?Math.round(dm.exp/1000)+'k':dm.exp}`;el.appendChild(dd);}
      if(dm.inc>0){const dd=document.createElement('div');dd.className='day-dot income';dd.textContent=`+${dm.inc>=10000?Math.round(dm.inc/1000)+'k':dm.inc}`;el.appendChild(dd);}
    }
    el.onclick=()=>{ const t=document.getElementById('date-'+dateStr); if(t) t.scrollIntoView({behavior:'smooth',block:'center'}); };
    grid.appendChild(el);
  }
  wrap.appendChild(grid);

  const totalExp=recs.filter(r=>r.type==='expense').reduce((a,r)=>a+r.amount,0);
  const totalInc=recs.filter(r=>r.type==='income').reduce((a,r)=>a+r.amount,0);
  const net=totalInc-totalExp;
  const summary=document.createElement('div'); summary.className='cal-summary';
  summary.innerHTML=`<div class="cal-sum-item"><div class="cal-sum-label">總額</div><div class="cal-sum-val purple">${(net<0?'-':'')+fmt(net)}</div></div><div class="cal-sum-item"><div class="cal-sum-label">支出</div><div class="cal-sum-val red">${fmt(totalExp)}</div></div><div class="cal-sum-item"><div class="cal-sum-label">收入</div><div class="cal-sum-val green">${fmt(totalInc)}</div></div>`;
  wrap.appendChild(summary); container.appendChild(wrap);

  const byDate={};
  recs.forEach(r=>{(byDate[r.date]=byDate[r.date]||[]).push(r);});
  const allCats=[...CATS.expense,...CATS.income,...CATS.transfer];
  Object.keys(byDate).sort((a,b)=>b.localeCompare(a)).forEach(date=>{
    const items=byDate[date];
    const [,mm,dd]=date.split('-');
    const wd=['週日','週一','週二','週三','週四','週五','週六'][new Date(date).getDay()];
    const dayExp=items.filter(r=>r.type==='expense').reduce((a,r)=>a+r.amount,0);
    const grp=document.createElement('div'); grp.className='date-group'; grp.id='date-'+date;
    grp.innerHTML=`<div class="date-header"><span class="date-text">${parseInt(mm)}/${parseInt(dd)}（${wd}）</span><span class="date-sum">支出:${fmt(dayExp)}</span></div>`;
    items.forEach(r=>{
      const cat=allCats.find(c=>c.id===r.cat)||{emoji:'💰',name:r.cat};
      const div=document.createElement('div'); div.className='tx-item';
      div.innerHTML=`<div class="tx-icon">${cat.emoji}</div><div class="tx-info"><div class="tx-name">${cat.name}</div><div class="tx-sub">${r.note||'自己'}</div></div><div class="tx-right"><div class="tx-amount ${r.type}">${r.type==='expense'?'-':'+'}${fmt(r.amount)}</div></div>`;
      grp.appendChild(div);
    });
    container.appendChild(grp);
  });
}
